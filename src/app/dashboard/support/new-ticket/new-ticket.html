<form (ngSubmit)="onSubmit(titleElement.value, requestElement.value)" #form>
  <ms-control label="Title">
    <input name="title" id="title" type="text" #titleElement #inputMS />
  </ms-control>

  <!-- <ms-control label="Name">
    <input name="name" id="name" type="text" #nameElement #inputMS />
  </ms-control> -->

  <ms-control label="Request">
    <textarea name="request" id="request" rows="3" #requestElement #inputMS></textarea>
  </ms-control>

  <p>
    <button msButton>
      Submit
      <!-- <span class="icon">↠</span> -->
      <span ngProjectAs="icon">↠</span>
    </button>
  </p>
</form>
